name: Build CloverGram Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          choco install cmake ninja --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Run prepare script
        run: |
          python -m pip install --upgrade pip
          python Telegram/build/prepare/win.py

      - name: Build with CMake
        run: |
          cmake -B out -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build out --target Telegram --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloverGram-Windows
          path: out/bin/Telegram.exe
