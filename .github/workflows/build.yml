name: Build CloverGram Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
          path: tdesktop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare build folders and environment
        shell: cmd
        run: |
          mkdir ThirdParty
          mkdir Libraries

      - name: Run prepare scripts
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd tdesktop
          call Telegram\build\prepare\win.bat

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd tdesktop\Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Project
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd tdesktop
          cmake --build out --config Release --target Telegram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloverGram-Release
          path: |
            tdesktop/out/Release/AyuGram.exe
            tdesktop/out/Release/Telegram.exe
